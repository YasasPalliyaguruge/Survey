name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency tree
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  remove-unused-chart-deps:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/recruiter-readiness'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Remove unused chart dependencies
        run: npm uninstall chart.js react-chartjs-2 recharts --no-audit --no-fund

      - name: Reinstall generated dependency tree
        run: npm ci

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=critical || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit npm-generated dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Chart dependencies are already absent."
            exit 0
          fi
          git commit -m "Remove unused chart dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
