name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency tree
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  dependency-cleanup-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/recruiter-readiness'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependency tree
        run: npm ci

      - name: Remove unused direct dependencies
        run: npm uninstall firebase @firebase/firestore @tanstack/react-table @types/react-router-dom --package-lock-only --ignore-scripts

      - name: Apply compatible production fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts

      - name: Reinstall from candidate lockfile
        run: |
          rm -rf node_modules
          npm ci

      - name: Audit candidate production tree
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint candidate
        run: npm run lint

      - name: Build candidate
        run: npm run build

      - name: Commit validated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Candidate package files already match the branch."
            exit 0
          fi
          git commit -m "Reduce dependency vulnerability surface"
          git push origin "HEAD:${{ github.head_ref }}"
